apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: docker.io/yatharthchandel/order-service:v1
          ports:
            - containerPort: 5003
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

