apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: docker.io/yatharthchandel/order-service@sha256:caa2d5b962128120f08881cf65c091e9aacd3dd07daa02ea7b8a80d05f75deee
          ports:
            - containerPort: 5003
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

